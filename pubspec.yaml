name: battle_chess_arena
description: GPL-licensed animated multi-theme chess platform.
publish_to: "none"
version: 0.9.0-beta.36+51

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  dartchess: ^0.13.1
  stockfish:
    path: third_party/stockfish
  web_socket_channel: ^3.0.3
  audioplayers: ^6.8.1
  app_links: ^7.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/battle_chess_arena_icon_v7.png
