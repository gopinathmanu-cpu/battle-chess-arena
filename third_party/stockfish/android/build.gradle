group 'com.stockfish'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.arjanaswal.stockfish'
    ndkVersion '28.2.13676358'

    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
        ndk {
            // Follow Flutter's requested targets instead of building unused ABIs.
            def flutterAbis = ['android-arm': 'armeabi-v7a', 'android-arm64': 'arm64-v8a', 'android-x64': 'x86_64']
            def targets = (project.findProperty('target-platform') ?: 'android-arm,android-arm64,android-x64').split(',')
            abiFilters(*targets.collect { flutterAbis[it] }.findAll { it != null })
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}
